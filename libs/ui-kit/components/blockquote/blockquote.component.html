@if (iconName(); as iconName) {
  <div class="ng-doc-blockquote-icon" aria-hidden="true">
    <ng-doc-icon [icon]="iconName" size="24"></ng-doc-icon>
  </div>
}
<div class="ng-doc-blockquote">
  @if (title(); as title) {
    <span class="ng-doc-blockquote-title">{{ title }}</span>
  }
  <ng-content></ng-content>
</div>
