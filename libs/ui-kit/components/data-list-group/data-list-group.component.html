<ng-doc-list>
  @if (items()?.length) {
    @for (group of groupItems(); track group) {
      <ng-doc-option-group>
        <!-- The context literals are memoized per group and item, like a pure pipe. -->
        <span
          *polymorpheusOutlet="groupContent() as groupText; context: { $implicit: group }"
          ngDocOptionGroupHeader>
          {{ groupText }}
        </span>
        @for (item of groups().get(group); track trackByFn()($index, item)) {
          <ng-doc-option [value]="defineValueFn()(item)" [disabled]="itemDisabledFn()(item)">
            <ng-container *polymorpheusOutlet="itemContent() as text; context: { $implicit: item }">
              {{ text }}
            </ng-container>
          </ng-doc-option>
        }
      </ng-doc-option-group>
    }
  } @else {
    <div class="ng-doc-empty-message" ng-doc-text>
      @if (emptyContent()) {
        <ng-container *polymorpheusOutlet="emptyContent() as text"> {{ text }} </ng-container>
      }
    </div>
  }
</ng-doc-list>
