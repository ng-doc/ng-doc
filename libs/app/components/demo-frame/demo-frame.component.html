@if (created()) {
  <iframe
    #frame
    class="ng-doc-demo-frame-iframe"
    loading="lazy"
    [src]="frameSrc()"
    [title]="frameTitle()"
    [style.height.px]="fill() ? null : height()"
    (load)="onLoad()"></iframe>
}
@if (state() !== 'ready') {
  <div class="ng-doc-demo-frame-status" role="status" [attr.aria-busy]="state() === 'loading'">
    @if (state() === 'loading') {
      <span class="ng-doc-demo-frame-skeleton" aria-hidden="true"></span>
      <span
        >{{ texts.loading }}
        <a [href]="src()" target="_blank" rel="noopener">{{ texts.openFrameInNewTab }}</a></span
      >
    } @else {
      <span
        >{{ texts.failed }}
        <a [href]="src()" target="_blank" rel="noopener">{{ texts.openFrameInNewTab }}</a></span
      >
    }
  </div>
}
