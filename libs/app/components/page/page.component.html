<div class="ng-doc-page-controls">
  <button
    type="button"
    ng-doc-button-icon
    [rounded]="false"
    [attr.aria-label]="linkCopied() ? 'Link copied' : 'Copy link to this page'"
    [ngDocTooltip]="linkCopied() ? 'Copied' : 'Copy link'"
    [attr.data-ng-doc-copied]="linkCopied()"
    (click)="copyLink()">
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true">
      <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7" />
      <path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7" />
    </svg>
  </button>
  @if (rootPage.editSourceFileUrl) {
    <a
      ng-doc-button-icon
      [rounded]="false"
      [href]="rootPage.editSourceFileUrl"
      target="_blank"
      rel="noopener"
      aria-label="Edit this page"
      ngDocTooltip="Edit this page">
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true">
        <path d="M12 20h9M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4Z" />
      </svg>
    </a>
  }
  @if (rootPage.viewSourceFileUrl) {
    <a
      ng-doc-button-icon
      [rounded]="false"
      [href]="rootPage.viewSourceFileUrl"
      target="_blank"
      rel="noopener"
      aria-label="View the page source"
      ngDocTooltip="View source">
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true">
        <path d="m8 7-5 5 5 5m8-10 5 5-5 5" />
      </svg>
    </a>
  }
</div>

@if (rootPage.pageContentSource) {
  @if (contentController.error(); as error) {
    <div class="ng-doc-page-wrapper" role="alert">{{ error.message }}</div>
  } @else {
    <div
      class="ng-doc-page-wrapper"
      [ngDocPageProcessor]="contentController.html() | ngDocSanitizeHtml"
      [contentVersion]="contentController.version()"
      (beforeRender)="revealLoaded($event)"
      (contentProcessed)="contentController.processed($event)"
      (processingError)="contentController.processingFailed($event)"
      (afterRender)="createToc()"
      #pageContainer></div>
  }
} @else {
  <div
    class="ng-doc-page-wrapper"
    [ngDocPageProcessor]="rootPage.pageContent | ngDocSanitizeHtml"
    (afterRender)="createToc()"
    #pageContainer></div>
}

@if (!rootPage.page?.disableFullscreenRoutes) {
  <ng-doc-dialog-outlet [config]="{ width: '100vw', height: '100vh' }">
    <div class="ng-doc-fullscreen-wrapper">
      <router-outlet></router-outlet>
    </div>
  </ng-doc-dialog-outlet>
}
