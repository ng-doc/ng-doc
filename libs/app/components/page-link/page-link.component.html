@if (usesRouterLink()) {
  <a [class]="classes()" [routerLink]="routerLink()">
    <ng-container *ngTemplateOutlet="content"></ng-container>
  </a>
} @else {
  <a [class]="classes()" [href]="path()" [attr.target]="isExternalLink() ? '_blank' : null">
    <ng-container *ngTemplateOutlet="content"></ng-container>
    @if (isExternalLink() && !isInCode()) {
      <ng-doc-icon icon="external-link"></ng-doc-icon>
    }
  </a>
}

<ng-template #content>
  <ng-content></ng-content>
</ng-template>
