<button
  class="ng-doc-search-field"
  type="button"
  aria-haspopup="dialog"
  [attr.aria-label]="'Search (' + chord() + ')'"
  aria-keyshortcuts="Meta+K Control+K"
  (click)="open()">
  <svg
    width="16"
    height="16"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    aria-hidden="true">
    <circle cx="11" cy="11" r="7" />
    <path d="m20 20-3.5-3.5" />
  </svg>
  <span class="ng-doc-search-placeholder">Search docs…</span>
  <kbd>{{ chord() }}</kbd>
</button>
<button
  class="ng-doc-search-button"
  type="button"
  ng-doc-button-icon
  size="large"
  [rounded]="false"
  aria-haspopup="dialog"
  [attr.aria-label]="'Search (' + chord() + ')'"
  aria-keyshortcuts="Meta+K Control+K"
  (click)="open()">
  <svg
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    aria-hidden="true">
    <circle cx="11" cy="11" r="7" />
    <path d="m20 20-3.5-3.5" />
  </svg>
</button>
