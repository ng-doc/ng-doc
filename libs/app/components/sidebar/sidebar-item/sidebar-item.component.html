<a
  class="ng-doc-sidebar-link"
  [routerLink]="[item().route]"
  routerLinkActive="active"
  ariaCurrentWhenActive="page">
  <span class="ng-doc-sidebar-link-title">{{ item().title }}</span>
  @for (status of statuses(); track $index) {
    <span class="ng-doc-sidebar-status" [attr.data-ng-doc-color]="status.type">{{
      status.text
    }}</span>
  }
</a>
