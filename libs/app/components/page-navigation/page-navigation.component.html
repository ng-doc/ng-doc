@if (prevPage() || nextPage()) {
  <nav class="ng-doc-navigation-controls" [attr.aria-label]="texts.pages">
    @if (prevPage(); as page) {
      <a class="ng-doc-prev-page" [routerLink]="page.route">
        <span class="ng-doc-navigation-page-label">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true">
            <path d="M19 12H5m6-6-6 6 6 6" />
          </svg>
          {{ texts.previous }}
        </span>
        <span class="ng-doc-navigation-page-title">{{ page.title }}</span>
      </a>
    }
    @if (nextPage(); as page) {
      <a class="ng-doc-next-page" [routerLink]="page.route">
        <span class="ng-doc-navigation-page-label">
          {{ texts.next }}
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true">
            <path d="M5 12h14m-6-6 6 6-6 6" />
          </svg>
        </span>
        <span class="ng-doc-navigation-page-title">{{ page.title }}</span>
      </a>
    }
  </nav>
}
