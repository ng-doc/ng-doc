@if (configuration(); as configuration) {
  @if (fallbackNote(); as note) {
    <p class="ng-doc-playground-note" role="note">{{ note }}</p>
  }
  <ng-doc-playground-properties
    [form]="formGroup()!"
    [properties]="properties()"
    [ignoreInputs]="configuration.hiddenInputs"
    [dynamicContent]="configuration.content"
    [hideSidePanel]="configuration.hideSidePanel ?? false"
    [inspectorPosition]="configuration.inspectorPosition ?? 'right'"
    [defaultValues]="defaultValues()"
    [waitingForDefaults]="isolated()"
    [showResetButton]="!isDefaultState()"
    [(recreateDemo)]="recreateDemo"
    [recreateLocked]="recreateLocked()"
    (resetForm)="resetForm()">
    @for (selector of configuration.selectors ?? selectors() | asArray; track selector) {
      <ng-doc-playground-demo
        [id]="id()"
        [selector]="selector"
        [properties]="properties()"
        [configuration]="configuration"
        [recreateDemo]="recreateDemo()"
        [form]="formGroup()"
        [expanded]="configuration.expanded ?? false"
        [frame]="frames()?.get(selector)"
        [frameDefaults]="defaultValues()"
        (frameMessage)="onFrameMessage($event)"
        (frameSilent)="onFrameSilent()">
      </ng-doc-playground-demo>
    }
    @if (pipeName()) {
      <ng-doc-playground-demo
        [id]="id()"
        [pipeName]="pipeName()"
        [properties]="properties()"
        [configuration]="configuration"
        [recreateDemo]="recreateDemo()"
        [form]="formGroup()"
        [frame]="frames()?.get(pipeName())"
        [frameDefaults]="defaultValues()"
        (frameMessage)="onFrameMessage($event)"
        (frameSilent)="onFrameSilent()">
      </ng-doc-playground-demo>
    }
  </ng-doc-playground-properties>
}
