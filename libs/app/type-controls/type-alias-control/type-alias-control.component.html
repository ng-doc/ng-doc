<ng-doc-combobox
  [ngModel]="model()"
  [readonly]="true"
  [valueContent]="valueTemplate"
  [clearButton]="false"
  [rightContent]="rightContent"
  (ngModelChange)="changeModel($event)">
  <ng-doc-list *ngDocData>
    @for (item of items(); track $index) {
      <ng-doc-option [value]="item.value">
        <div class="ng-doc-type-alias-option">
          <ng-container
            *ngTemplateOutlet="valueTemplate; context: { $implicit: item.value }"></ng-container>
          <!-- The slot stays when empty, so the default markers line up. -->
          <span class="ng-doc-type-alias-check" data-ng-doc-type-alias-check>
            @if (item.value === model()) {
              <ng-doc-icon icon="check" aria-hidden="true"></ng-doc-icon>
            }
          </span>
        </div>
      </ng-doc-option>
    }
  </ng-doc-list>
  <ng-template let-value #valueTemplate>
    <div class="ng-doc-type-alias-value">
      <span class="ng-doc-type-alias-value-text">{{ labelOf(value) }}</span>
      @if (value === default()) {
        <span class="ng-doc-type-alias-default">{{ texts.defaultValue }}</span>
      }
    </div>
  </ng-template>
  <ng-template #rightContent>
    @if (canReset(model())) {
      <button
        ng-doc-button-icon-transparent
        size="large"
        [attr.aria-label]="texts.resetToDefault"
        [ngDocFocusable]="false"
        [disabled]="disabled"
        [rounded]="false"
        (click)="updateModel(default() ?? null)"
        (focusout)="touch()">
        <ng-doc-icon icon="x"></ng-doc-icon>
      </button>
    }
  </ng-template>
</ng-doc-combobox>
