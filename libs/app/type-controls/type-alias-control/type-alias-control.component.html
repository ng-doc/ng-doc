<ng-doc-combobox
  [ngModel]="model()"
  [readonly]="true"
  [valueContent]="valueTemplate"
  [clearButton]="false"
  [rightContent]="rightContent"
  (ngModelChange)="changeModel($event)">
  <ng-doc-list *ngDocData>
    @for (option of options(); track option) {
      @if (isManual() ? option : (option | ngDocExtractValue); as value) {
        <ng-doc-option [value]="value">
          <ng-container
            *ngTemplateOutlet="valueTemplate; context: { $implicit: value }"></ng-container>
        </ng-doc-option>
      }
    }
  </ng-doc-list>
  <ng-template let-value #valueTemplate>
    <div class="ng-doc-type-alias-value">
      <span class="ng-doc-type-alias-value-text">{{ value }}</span>
      @if (value === default()) {
        <span class="ng-doc-type-alias-default">default</span>
      }
    </div>
  </ng-template>
  <ng-template #rightContent>
    @if (model() && model() !== default()) {
      <button
        ng-doc-button-icon-transparent
        size="large"
        aria-label="Reset to the default value"
        [ngDocFocusable]="false"
        [disabled]="disabled"
        [rounded]="false"
        (click)="updateModel(default() ?? null)"
        (focusout)="touch()">
        <ng-doc-icon icon="x"></ng-doc-icon>
      </button>
    }
  </ng-template>
</ng-doc-combobox>
