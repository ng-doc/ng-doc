# A single-package workspace: this file only holds pnpm settings.

# pnpm runs no dependency install scripts unless they are allowed here, and fails the install on
# any other. These packages build or fetch their native binaries on install.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true

# Security fixes for transitive dependencies (patch or minor releases in the same major). Remove an
# entry once the package that pins the vulnerable version releases a fixed one.
overrides:
  # Shipped: @ng-doc/app > mermaid@10.9.8 > dompurify (^3.2.4)
  'dompurify@<3.4.17': 3.4.17
  # Peers of the published packages (@angular/forms, @angular/build); dev-only in this repository
  'zod@>=4.0.0 <4.6.6': 4.6.6
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  # Nx 23.2.1 pins these
  'smol-toml@<1.7.1': 1.7.1
  'brace-expansion@>=4.0.0 <5.0.11': 5.0.11
  'axios@>=1.13.0 <1.20.0': 1.20.0
  'follow-redirects@>=1.16.0 <1.16.2': 1.16.2
  # Angular CLI 22.2.1 pins this (22.2.2 and later pin 2.3.1)
  '@modelcontextprotocol/server@>=2.0.0 <2.3.0': 2.3.1
  # express (the site's SSR server) and webpack-dev-server
  'proxy-addr@<2.0.8': 2.0.8
  'body-parser@<1.20.9': 1.20.9
  'body-parser@>=2.0.0 <2.4.0': 2.4.0
  # serve 14.2.6 pins compression 1.8.1
  'compression@<1.8.2': 1.8.2
  'launch-editor@<2.14.2': 2.14.2
  # jsdom (test environment)
  'undici@>=7.0.0 <7.30.1': 7.30.1
  # @angular/build 22.2.1 pins vite 8.3.0
  'vite@>=8.3.0 <8.3.3': 8.3.3
