name: 📚 Deploy

# Deploys ng-doc.com from the `site` artifact of the release run that calls it: release.yml calls
# it after a stable release from main.

on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: site

      - name: Extract artifact
        run: tar -xvf ng-doc.tar

      - name: Deploy
        run: |
          aws s3 rm s3://ng-doc --recursive
          aws s3 sync ./dist/apps/ng-doc/browser s3://ng-doc
          AWS_MAX_ATTEMPTS=10 aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_DISTRIBUTION_ID }} --paths "/*"
