name: 📚 Deploy

# Deploys ng-doc.com. release.yml calls it after a stable release from main, with the `site`
# artifact of its release job. Run by hand with a release tag (v22.2.0), it builds the site from
# that tag as the release does, then deploys it: this finishes a release whose deploy didn't run,
# and an older tag rolls the site back to that release.

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and deploy, for example v22.2.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ng-doc.com from ${{ inputs.tag }}
    # Only a run by hand builds the site. When release.yml calls this workflow, `inputs` holds the
    # inputs of the call, which has none, and the site comes from the release job.
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
      NX_TUI: 'false'
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::\"$TAG\" is not the tag of a stable release, such as v22.2.0."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          # The same checkout as the release job, which builds the site it deploys.
          fetch-depth: 0
          fetch-tags: true

      - uses: ./.github/actions/nodejs

      # The steps of release.yml that build the site: the packages, then ng-doc.com with the Vite
      # engine from them.
      - name: Build the packages
        run: pnpm exec nx run-many --target=build --projects=tag:type:lib --parallel=1 --skipNxCache

      - name: Build the documentation
        run: |
          pnpm exec nx run ng-doc:link-libs --excludeTaskDependencies
          pnpm exec nx run ng-doc:build --excludeTaskDependencies --skipNxCache
          tar -cf ng-doc.tar dist/apps/ng-doc/browser

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: site
          path: ng-doc.tar
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: build
    # After the build of a run by hand, or, when release.yml calls this workflow, with no build.
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Two deploys at once would interleave their removals and uploads.
    concurrency:
      group: deploy-ng-doc
      cancel-in-progress: false
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: site

      - name: Extract artifact
        run: tar -xvf ng-doc.tar

      - name: Deploy
        run: |
          aws s3 rm s3://ng-doc --recursive
          aws s3 sync ./dist/apps/ng-doc/browser s3://ng-doc
          AWS_MAX_ATTEMPTS=10 aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_DISTRIBUTION_ID }} --paths "/*"
