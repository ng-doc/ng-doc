name: Seed dependency caches

# Pull requests restore node_modules from caches of their base branch. Installing it here, for every
# OS and Node version the pull request jobs use, means a pull request never starts cold unless it
# changes the lockfile.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed:
    name: node_modules (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '24.19.0'
          - os: windows-latest
            node: '24.19.0'
          # The packed ng add check (ng-add-e2e) also runs on macOS.
          - os: macos-latest
            node: '24.19.0'
          - os: ubuntu-latest
            node: '24.15.0'
          - os: ubuntu-latest
            node: '24.21.0'
    steps:
      # The cache key hashes package-lock.json, so Windows must check it out as the pull request
      # jobs do.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/nodejs
        with:
          node-version: ${{ matrix.node }}
          seed: 'true'
