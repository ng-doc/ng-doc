name: Seed dependency caches

# Pull requests restore the pnpm store from caches of their base branch. Filling it here, for every
# OS the pull request jobs use, means a pull request never downloads its dependencies unless it
# changes the lockfile. The store holds package contents only, so one cache serves every Node
# version of an OS.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed:
    name: pnpm store (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The packed ng add check (ng-add-e2e) also runs on macOS.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # The cache key hashes pnpm-lock.yaml, so Windows must check it out as the pull request
      # jobs do.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/nodejs
        with:
          seed: 'true'
