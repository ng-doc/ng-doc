name: 📦 Release

on:
  push:
    branches:
      - release
      - beta
      - '*.x'

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    with:
      head: ${GITHUB_REF##*/}
  test:
    uses: ./.github/workflows/test.yml
    with:
      head: ${GITHUB_REF##*/}

  release:
    runs-on: ubuntu-latest
    needs: [lint, test]
    # id-token: npm trusted publishing (OIDC). Git and GitHub steps use the SEMANTIC_RELEASE token.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SEMANTIC_RELEASE }}

      - run: git fetch origin ${{ inputs.base }}

      - name: Setup Node.js
        uses: ./.github/actions/nodejs

      - name: Build Libraries
        run: npx nx run-many --projects=tag:type:lib --target=build --configuration=ci --parallel

      # ng-doc.com is built with the Vite engine (the site's `build` target), from the libraries
      # built above. It skips the Nx cache, so every release builds the site from scratch.
      - name: Build Documentation
        run: |
          npx nx run ng-doc:link-libs --excludeTaskDependencies
          npx nx run ng-doc:build --excludeTaskDependencies --skipNxCache

      - name: Build Applications
        run: npx nx run-many --projects='tag:type:app,!ng-doc' --target=build --configuration=ci --parallel

      # deploy.yml syncs dist/apps/ng-doc/browser from the tar.
      - name: Tar Artifacts
        run: tar -cvf ng-doc.tar dist/apps/ng-doc/browser

      - name: Uploading Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: ng-doc.tar

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE }}
          # Fallback only: packages publish through trusted publishing. Remove with the secret once a
          # release shows provenance.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
