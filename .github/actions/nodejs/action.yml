name: NgDoc action for Node.js
description: Set up Node.js and pnpm, and install the workspace's node_modules from the lockfile.

inputs:
  node-version:
    description: Node.js version. The builder requires Node >=24.15.0 <25.
    required: false
    default: '24.19.0'
  seed:
    description: >-
      'true' only in the cache-seeding workflow: check for the pnpm store cache without downloading
      it, and install and save the store on a miss. Other jobs only restore, so that pull requests
      that change the lockfile never evict the caches of the base branch.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        # The pnpm store is cached below; setup-node's own cache would only add a second restore.
        package-manager-cache: false

    # Corepack installs the pnpm version that the packageManager field of package.json names.
    - name: Use pnpm
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: |
        corepack enable pnpm
        pnpm --version

    # Asked from the workspace, because pnpm keeps the store on the workspace's drive so that it
    # can hard-link packages into node_modules.
    - name: Locate the pnpm store
      id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    # The store holds package contents only, so one cache serves every Node version of an OS.
    - name: Restore the pnpm store
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        lookup-only: ${{ inputs.seed }}

    # On a store hit this only links packages and runs the allowed install scripts; on a miss
    # (a pull request that changes the lockfile) it downloads what the store lacks.
    - name: Install dependencies
      if: inputs.seed != 'true' || steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Save the pnpm store
      if: inputs.seed == 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: ${{ steps.restore.outputs.cache-primary-key }}
