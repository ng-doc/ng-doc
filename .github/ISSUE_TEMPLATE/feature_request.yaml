name: '🚀 Feature request'
description: Suggest an idea or an improvement for NgDoc.
labels: ['Type: Enhancement']
assignees: skoropadas

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like NgDoc to do? An example of the API or the result helps.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Optional. Workarounds or other approaches you have considered.
