name: '🐞 Bug report'
description: Something in NgDoc doesn't work as expected.
labels: ['Type: Bug']
assignees: skoropadas

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please check the [existing issues](https://github.com/ng-doc/ng-doc/issues) first. A small reproduction is the fastest way to a fix.

  - type: input
    id: ngdoc-version
    attributes:
      label: NgDoc version
      placeholder: e.g. 22.0.0
    validations:
      required: true

  - type: input
    id: angular-version
    attributes:
      label: Angular version
      placeholder: e.g. 22.0.0
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: Engine
      description: Which engine builds your docs? Your `angular.json` or `project.json` shows the builder.
      options:
        - Vite engine (vite-dev-server or vite-application builder, Vite plugin, or ng-doc CLI)
        - Legacy builders (dev-server or application)
        - Not sure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Node version and OS
      placeholder: e.g. Node 24.19.0 on macOS 15

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Tell us what you saw and what you expected instead. Screenshots are welcome.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A link to a repository or StackBlitz, or the minimal steps to reproduce the bug.
      placeholder: |
        1. Create a page with ...
        2. Run `ng serve` ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste the terminal or browser console output. It is formatted as code automatically.
      render: shell
